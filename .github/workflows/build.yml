# Mirrors the custom build recipe (Containerfile.build + scripts/build-container.sh):
# build the image, run it with OUTPUT mounted, then upload everything it emits
# into $OUTPUT as workflow artifacts (and attach the tarballs to the release).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f Containerfile.build -t solidvanilla/solid-vanilla:${{ github.sha }} .

      - name: Run build gate + emit artifacts
        run: |
          mkdir -p artifacts
          docker run --rm \
            -e OUTPUT=/output \
            -v "$PWD/artifacts:/output" \
            solidvanilla/solid-vanilla:${{ github.sha }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solid-vanilla-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  # Release assets are publicly downloadable without a GitHub login
  # (workflow artifacts are not). Two releases are maintained:
  #   - build-<sha>: immutable, one per commit (fixed name based on hash)
  #   - latest:      rolling pointer to the newest main build
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compute short commit hash
        id: shortsha
        run: echo "sha=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: solid-vanilla-${{ github.sha }}
          path: artifacts

      - name: Publish fixed release for this commit
        # Immutable per-commit release: tag and name are derived from the
        # commit hash, so each run gets its own release and never overwrites
        # a previous one.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.shortsha.outputs.sha }}
          name: build-${{ steps.shortsha.outputs.sha }}
          files: artifacts/*.tgz
          make_latest: false
          body: |
            Build of commit ${{ github.sha }}
            (https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
            Publish-ready npm tarballs (`bun pm pack`) for:
            - solid-vanilla (reactive framework)
            - solid-vanilla-ui (depends on core)
            - solid-vanilla-server (Express helper)

      - name: Delete previous "latest" release
        # action-gh-release only updates an existing release in place: old
        # assets are kept and body/title may not be rewritten. Delete the
        # old release + tag so a fresh one is created each run.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Publish rolling "latest" pointer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: artifacts/*.tgz
          make_latest: true
          body: |
            Rolling build from main (${{ github.sha }}).
            Fixed per-commit release: [`build-${{ steps.shortsha.outputs.sha }}`](https://github.com/${{ github.repository }}/releases/tag/build-${{ steps.shortsha.outputs.sha }})
            Publish-ready npm tarballs (`bun pm pack`) for:
            - solid-vanilla (reactive framework)
            - solid-vanilla-ui (depends on core)
            - solid-vanilla-server (Express helper)